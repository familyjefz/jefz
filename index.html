<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Silsilah Keluarga</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="header-row1">
      <h2 class="header-title">Silsilah Keluarga</h2>
      <div class="header-search-wrap">
        <div class="header-search-inner">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="Cari nama...">
          <button id="search-btn-go" class="search-btn-go">Cari</button>
        </div>
        <div id="search-suggestions" class="search-suggestions"></div>
      </div>
      <div class="header-stats" id="stats-display">👁 — | 🟢 —</div>
      <button id="invert-btn" class="invert-btn">🎨</button>
      <button id="login-btn" class="login-btn">👤</button>
    </div>
    <div class="header-row2" id="header-controls">
      <button id="filter-btn" class="filter-btn">🔎 Filter</button>
      <button id="expand-btn" class="expand-btn">👁 Show All</button>
      <button id="addtree-btn" class="addtree-btn" style="display:none;">🌳 Tree Baru</button>
      <button id="reposition-btn" class="reposition-btn" style="display:none;">📍 Reposisi</button>
      <button id="connect-mode-btn" class="connect-mode-btn" style="display:none;">🔗 Connect</button>
      <button id="undo-btn" class="undo-btn" style="display:none;">↩️ Undo</button>
      <button id="redo-btn" class="redo-btn" style="display:none;">↪️ Redo</button>
    </div>
  </div>

  <div class="tree-wrapper" id="tree-wrapper">
    <div class="tree-zoom-container" id="tree-zoom-container">
      <div id="tree"></div>
    </div>
  </div>

  <div class="bottom-zoom-bar">
    <button id="zoom-reset" class="zoom-reset-btn">⟳</button>
    <input type="range" id="zoom-slider" class="zoom-slider" min="30" max="300" value="100" step="1">
    <span id="zoom-value" class="zoom-value">100%</span>
  </div>

  <!-- Banner mode connect (manual link) -->
  <div id="connect-mode-banner" class="connect-mode-banner">
    <span id="connect-mode-banner-text">🔗 Pilih node pertama...</span>
    <button id="connect-mode-cancel-btn">Batal</button>
  </div>

  <!-- Banner mode hubungkan (orang tua/anak) -->
  <div id="hubungkan-banner" class="hubungkan-banner">
    <span id="hubungkan-banner-text">🔗 Pilih node tujuan</span>
    <button id="hubungkan-cancel-btn">Batal</button>
  </div>

  <!-- Banner mode reposisi -->
  <div id="reposition-banner" class="reposition-banner">
    <span>📍 Mode Reposisi: geser tree dengan menyentuh nodenya</span>
    <button id="reposition-done-btn">Selesai</button>
  </div>
</div>

<!-- Modal Login -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Login Admin</h3>
      <span class="close">&times;</span>
    </div>
    <div class="modal-body">
      <p>Masukkan PIN untuk mengakses menu edit:</p>
      <input type="password" id="pin-input" class="pin-input" placeholder="Masukkan PIN">
      <div id="pin-error" class="pin-error"></div>
      <button id="submit-pin" class="pin-submit">Login</button>
    </div>
  </div>
</div>

<!-- Modal Info -->
<div id="info-modal" class="modal">
  <div class="modal-content info-modal-content">
    <div class="modal-header info-header">
      <h3 id="info-title">Informasi</h3>
      <span class="close-info">&times;</span>
    </div>
    <div class="modal-body" id="info-body"></div>
  </div>
</div>

<!-- Modal Filter Tree -->
<div id="filter-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Filter Tree</h3>
      <span class="close-filter">&times;</span>
    </div>
    <div class="modal-body">
      <label class="filter-all-row">
        <input type="checkbox" id="filter-all-checkbox"> <strong>Semua Keluarga</strong>
      </label>
      <hr style="margin:10px 0; border:0; border-top:1px solid #ddd;">
      <div class="filter-actions">
        <button id="filter-select-all" type="button">Select All</button>
        <button id="filter-deselect-all" type="button">Deselect All</button>
      </div>
      <div id="filter-tree-list" class="filter-tree-list"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button id="filter-apply" class="filter-apply" type="button">Terapkan</button>
        <button id="filter-cancel" class="filter-cancel" type="button">Batal</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Tambah Tree -->
<div id="addtree-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Tambah Tree Baru</h3>
      <span class="close-addtree">&times;</span>
    </div>
    <div class="modal-body">
      <p>Nama root tree baru:</p>
      <input type="text" id="addtree-name-input" class="pin-input" placeholder="Contoh: Keluarga Baru">
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button id="addtree-submit" class="pin-submit" style="flex:1;">Buat</button>
        <button id="addtree-cancel" class="pin-submit" style="flex:1;">Batal</button>
      </div>
    </div>
  </div>
</div>

<!-- Custom Popup -->
<div id="custom-popup" class="custom-popup">
  <div class="custom-popup-content">
    <div class="custom-popup-header">
      <h4 id="popup-title">Peringatan</h4>
    </div>
    <div class="custom-popup-body" id="popup-message"></div>
    <div class="custom-popup-buttons" id="popup-buttons"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="js/config.js"></script>
<script src="js/zoom-pan.js"></script>
<script src="js/ui-modal.js"></script>
<script src="js/admin-undo.js"></script>
<script src="js/connections.js"></script>
<script src="js/family-tree.js"></script>
<script src="js/family-info.js"></script>
<script src="js/multi-tree.js"></script>
<script src="js/search.js"></script>
<script src="js/stats.js"></script>
<script src="js/main.js"></script>
</body>
</html>
