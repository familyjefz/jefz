<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test 2 Tree</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.css">
  <style>
    .forest-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      padding: 20px;
    }
    .tree-container {
      display: inline-block;
      vertical-align: top;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.5);
    }
    .tree-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
      padding: 5px;
      background: #f0f0f0;
      border-radius: 5px;
    }
    .node-box { background: white; border: 1px solid #ccc; padding: 10px; min-width: 100px; text-align: center; }
    .node-name { font-weight: bold; }
  </style>
</head>
<body>
<h1>Silsilah Keluarga</h1>
<div id="forest-container" class="forest-container"></div>

<script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.min.js"></script>
<script>
const families = [
  {
    name: "Keluarga Sekghor",
    data: {
      name: ">Sekghor |",
      children: [
        { name: ">Salama | Tohin", children: [] },
        { name: ">Ryfan |", children: [] },
        { name: ">Abd Hary |", children: [] }
      ]
    }
  },
  {
    name: "Keluarga Budi",
    data: {
      name: ">Budi |",
      children: []
    }
  }
];

function convert(node) {
  return {
    innerHTML: `<div class="node-box"><div class="node-name">${node.name}</div></div>`,
    children: node.children?.map(c => convert(c)) || []
  };
}

const container = document.getElementById("forest-container");

families.forEach((family, idx) => {
  const treeDiv = document.createElement("div");
  treeDiv.className = "tree-container";
  
  const title = document.createElement("div");
  title.className = "tree-title";
  title.innerText = family.name;
  treeDiv.appendChild(title);
  
  const tempDiv = document.createElement("div");
  tempDiv.id = `tree-${idx}`;
  treeDiv.appendChild(tempDiv);
  
  container.appendChild(treeDiv);
  
  new Treant({
    chart: {
      container: `#tree-${idx}`,
      rootOrientation: "NORTH",
      connectors: { type: "step" },
      animateOnInit: false,
      levelSeparation: 30,
      siblingSeparation: 30
    },
    nodeStructure: convert(family.data)
  });
});
</script>
</body>
</html>
