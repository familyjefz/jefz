<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Silsilah Keluarga</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.css">
  <style>
    .forest-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      padding: 20px;
    }
    .tree-container {
      display: inline-block;
      vertical-align: top;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.5);
    }
    .tree-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
      padding: 5px;
      background: #f0f0f0;
      border-radius: 5px;
    }
    .node-box { background: white; border: 1px solid #ccc; padding: 10px; min-width: 100px; text-align: center; }
    .node-name { font-weight: bold; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .family-selector { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
    button { padding: 8px 12px; border-radius: 5px; border: none; cursor: pointer; background: #333; color: white; }
    .login-btn { background: #4caf50; }
    .add-family-btn { background: #ff9800; }
  </style>
</head>
<body>

<h2>Silsilah Keluarga</h2>

<div class="controls">
  <select id="family-selector" class="family-selector">
    <option value="all">-- Semua Keluarga --</option>
    <option value="1">Sekghor</option>
    <option value="2">Budi</option>
  </select>
  <button id="add-family-btn" class="add-family-btn" style="display:none;">➕ Tambah Keluarga</button>
  <button id="zoom-in">🔍+</button>
  <button id="zoom-out">🔍-</button>
  <button id="zoom-reset">⟳</button>
  <button id="login-btn" class="login-btn">👤 Login Admin</button>
</div>

<div id="forest-container" class="forest-container"></div>

<script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.min.js"></script>
<script>
// ========== DATA KELUARGA ==========
const FAMILIES = [
  {
    id: 1,
    name: "Sekghor",
    data: {
      name: ">Sekghor |",
      children: [
        { name: ">Salama | Tohin", children: [] },
        { name: ">Ryfan |", children: [] },
        { name: ">Abd Hary |", children: [] }
      ]
    }
  },
  {
    id: 2,
    name: "Budi",
    data: {
      name: ">Budi |",
      children: []
    }
  }
];

let currentView = "all"; // "all" atau id keluarga
let currentZoom = 1;

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
}

function convert(node) {
  return {
    innerHTML: `<div class="node-box"><div class="node-name">${escapeHtml(node.name)}</div></div>`,
    children: node.children?.map(c => convert(c)) || []
  };
}

function render() {
  const container = document.getElementById("forest-container");
  container.innerHTML = "";
  
  if (currentView === "all") {
    // Tampilkan semua keluarga
    FAMILIES.forEach(family => {
      const treeDiv = document.createElement("div");
      treeDiv.className = "tree-container";
      
      const title = document.createElement("div");
      title.className = "tree-title";
      title.innerText = family.name;
      treeDiv.appendChild(title);
      
      const tempDiv = document.createElement("div");
      tempDiv.id = `tree-${family.id}`;
      treeDiv.appendChild(tempDiv);
      
      container.appendChild(treeDiv);
      
      new Treant({
        chart: {
          container: `#tree-${family.id}`,
          rootOrientation: "NORTH",
          connectors: { type: "step" },
          animateOnInit: false,
          levelSeparation: 30,
          siblingSeparation: 30
        },
        nodeStructure: convert(family.data)
      });
    });
  } else {
    // Tampilkan satu keluarga
    const family = FAMILIES.find(f => f.id == currentView);
    if (family) {
      new Treant({
        chart: {
          container: "#forest-container",
          rootOrientation: "NORTH",
          connectors: { type: "step" },
          animateOnInit: false,
          levelSeparation: 30,
          siblingSeparation: 30
        },
        nodeStructure: convert(family.data)
      });
    }
  }
}

function onFamilyChange() {
  currentView = document.getElementById("family-selector").value;
  render();
}

// Zoom
function setZoom(z) {
  currentZoom = z;
  document.getElementById("forest-container").style.transform = `scale(${z})`;
  document.getElementById("forest-container").style.transformOrigin = "top left";
}
function zoomIn() { setZoom(currentZoom + 0.1); }
function zoomOut() { setZoom(currentZoom - 0.1); }
function zoomReset() { setZoom(1); }

// Login (sementara)
let isAdmin = false;
function showLoginModal() {
  const pin = prompt("Masukkan PIN Admin:");
  if (pin === "00") {
    isAdmin = true;
    alert("Login berhasil!");
    document.getElementById("add-family-btn").style.display = "inline-block";
  } else {
    alert("PIN salah!");
  }
}

function addNewFamily() {
  const name = prompt("Masukkan nama kepala keluarga baru (contoh: >Cahyo |):");
  if (name) {
    const newId = FAMILIES.length + 1;
    FAMILIES.push({
      id: newId,
      name: name.split("|")[0].trim(),
      data: { name: name, children: [] }
    });
    // Update dropdown
    const selector = document.getElementById("family-selector");
    const opt = document.createElement("option");
    opt.value = newId;
    opt.text = name.split("|")[0].trim();
    selector.appendChild(opt);
    render();
    alert("Keluarga baru ditambahkan!");
  }
}

// Event
document.getElementById("family-selector")?.addEventListener("change", onFamilyChange);
document.getElementById("zoom-in")?.addEventListener("click", zoomIn);
document.getElementById("zoom-out")?.addEventListener("click", zoomOut);
document.getElementById("zoom-reset")?.addEventListener("click", zoomReset);
document.getElementById("login-btn")?.addEventListener("click", showLoginModal);
document.getElementById("add-family-btn")?.addEventListener("click", addNewFamily);

// Render awal
render();
</script>
</body>
</html>
