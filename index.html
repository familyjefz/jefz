<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silsilah Keluarga</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- D3.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  <!-- Turso libSQL -->
  <script type="module" src="js/app.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════
       OVERLAY: LOADING
  ══════════════════════════════════════════ -->
  <div id="loading-overlay" class="overlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p data-i18n="loading">Memuat data silsilah...</p>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════ -->
  <header id="main-header">
    <div class="header-left">
      <span class="header-logo">🌿</span>
      <span class="header-title" data-i18n="app.title">Silsilah Keluarga</span>
    </div>

    <div class="header-center">
      <!-- Search -->
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Cari nama..." data-i18n-placeholder="search.placeholder" />
        <span class="search-icon">⌕</span>
        <div id="search-results" class="search-dropdown hidden"></div>
      </div>
    </div>

    <div class="header-right">
      <!-- Stats -->
      <div class="header-stat" title="Sedang online">
        <span class="stat-icon">👁</span>
        <span id="stat-viewers">0</span>
      </div>
      <div class="header-stat" title="Total kunjungan">
        <span class="stat-icon">📊</span>
        <span id="stat-views">0</span>
      </div>

      <!-- Lang Switch -->
      <button id="btn-lang" class="btn-icon" title="Ganti bahasa">🌐</button>

      <!-- Invert Mode -->
      <button id="btn-invert" class="btn-icon" title="Invert mode">◑</button>

      <!-- Family Filter -->
      <button id="btn-families" class="btn-icon" title="Filter keluarga">⚙</button>

      <!-- Undo/Redo (admin only) -->
      <button id="btn-undo" class="btn-icon admin-only hidden" title="Undo">↩</button>
      <button id="btn-redo" class="btn-icon admin-only hidden" title="Redo">↪</button>

      <!-- Login button (public) / Admin badge (admin) -->
      <button id="btn-login" class="btn-login" data-i18n="login.btn">🔑 Login</button>
      <div id="admin-badge" class="admin-badge hidden">
        <span data-i18n="role.admin">Admin</span>
        <button id="btn-logout" class="btn-logout" data-i18n="logout">Keluar</button>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════
       MODAL: LOGIN
  ══════════════════════════════════════════ -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span>🔑 <span data-i18n="login.title">Login Admin</span></span>
        <button class="panel-close" data-panel="login-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" data-i18n="login.sub">Masukkan PIN Admin</label>
          <input type="password" id="pin-input" class="form-input" placeholder="••••" autocomplete="off" />
        </div>
        <p id="pin-error" class="pin-error" data-i18n="login.wrong">PIN salah, coba lagi.</p>
      </div>
      <div class="modal-footer">
        <button id="modal-login-cancel" class="btn-ghost" data-i18n="cancel">Batal</button>
        <button id="modal-login-confirm" class="btn-primary" data-i18n="login.confirm">Masuk</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       FAMILY FILTER PANEL
  ══════════════════════════════════════════ -->
  <div id="family-panel" class="side-panel hidden">
    <div class="panel-header">
      <span data-i18n="panel.families">Cabang Keluarga</span>
      <button class="panel-close" data-panel="family-panel">✕</button>
    </div>
    <div id="family-list" class="family-list">
      <!-- dinamis via JS -->
    </div>
    <button id="btn-add-family" class="btn-primary admin-only hidden" data-i18n="family.add">+ Tambah Cabang</button>
  </div>

  <!-- ══════════════════════════════════════════
       CANVAS AREA
  ══════════════════════════════════════════ -->
  <main id="canvas-wrap">
    <canvas id="tree-canvas"></canvas>

    <!-- Zoom controls -->
    <div class="zoom-controls">
      <button id="btn-zoom-in"  class="btn-zoom">+</button>
      <button id="btn-zoom-fit" class="btn-zoom">⊡</button>
      <button id="btn-zoom-out" class="btn-zoom">−</button>
    </div>
  </main>

  <!-- ══════════════════════════════════════════
       NODE CONTEXT PANEL (klik node)
  ══════════════════════════════════════════ -->
  <div id="node-panel" class="node-panel hidden">
    <div class="node-panel-header">
      <span id="node-panel-title">—</span>
      <button class="panel-close" data-panel="node-panel">✕</button>
    </div>

    <!-- Tab switcher -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="tab-option" data-i18n="tab.option">Option</button>
      <button class="tab-btn" data-tab="tab-info" data-i18n="tab.info">Info</button>
    </div>

    <!-- Tab: Option -->
    <div id="tab-option" class="tab-content active admin-only hidden">
      <div class="option-grid">
        <button class="opt-btn" data-action="edit">✏️ <span data-i18n="opt.edit">Edit</span></button>
        <button class="opt-btn" data-action="add">➕ <span data-i18n="opt.add">Tambah</span></button>
        <button class="opt-btn" data-action="move">↕️ <span data-i18n="opt.move">Pindah</span></button>
        <button class="opt-btn" data-action="delete">🗑️ <span data-i18n="opt.delete">Hapus</span></button>
        <button class="opt-btn" data-action="merge">🔗 <span data-i18n="opt.merge">Gabung</span></button>
        <button class="opt-btn" data-action="pair">💍 <span data-i18n="opt.pair">Set Nikah</span></button>
        <button class="opt-btn" data-action="edit-line">〰️ <span data-i18n="opt.editline">Edit Garis</span></button>
      </div>
    </div>

    <!-- Tab: Info -->
    <div id="tab-info" class="tab-content">
      <div id="node-info-content" class="info-content">
        <!-- dinamis via JS -->
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       SUB-MENU PANELS (Edit, Tambah, dll)
  ══════════════════════════════════════════ -->

  <!-- Edit Sub-menu -->
  <div id="panel-edit" class="sub-panel hidden">
    <div class="panel-header">
      <button class="panel-back" data-back="node-panel">← <span data-i18n="back">Kembali</span></button>
      <span data-i18n="opt.edit">Edit</span>
      <button class="panel-close" data-panel="panel-edit">✕</button>
    </div>
    <div class="sub-options">
      <button class="sub-opt" data-edit="name">👤 <span data-i18n="edit.name">Edit Nama</span></button>
      <button class="sub-opt" data-edit="gender">⚧ <span data-i18n="edit.gender">Edit Gender</span></button>
      <button class="sub-opt" data-edit="place">📍 <span data-i18n="edit.place">Edit Tempat Lahir</span></button>
      <button class="sub-opt" data-edit="notes">📝 <span data-i18n="edit.notes">Edit Catatan</span></button>
      <button class="sub-opt" data-edit="family">🏠 <span data-i18n="edit.family">Edit Keluarga</span></button>
    </div>
  </div>

  <!-- Tambah Sub-menu -->
  <div id="panel-add" class="sub-panel hidden">
    <div class="panel-header">
      <button class="panel-back" data-back="node-panel">← <span data-i18n="back">Kembali</span></button>
      <span data-i18n="opt.add">Tambah</span>
      <button class="panel-close" data-panel="panel-add">✕</button>
    </div>
    <div class="sub-options">
      <button class="sub-opt" data-add="child">👶 <span data-i18n="add.child">Tambah Anak</span></button>
      <button class="sub-opt" data-add="parent">👴 <span data-i18n="add.parent">Tambah Parent</span></button>
      <button class="sub-opt" data-add="spouse">💑 <span data-i18n="add.spouse">Tambah Pasangan</span></button>
      <button class="sub-opt" data-add="sibling">👥 <span data-i18n="add.sibling">Tambah Saudara</span></button>
    </div>
  </div>

  <!-- Edit Garis Sub-menu -->
  <div id="panel-edit-line" class="sub-panel hidden">
    <div class="panel-header">
      <button class="panel-back" data-back="node-panel">← <span data-i18n="back">Kembali</span></button>
      <span data-i18n="opt.editline">Edit Garis</span>
      <button class="panel-close" data-panel="panel-edit-line">✕</button>
    </div>
    <div class="sub-options">
      <button class="sub-opt" data-line="color">🎨 <span data-i18n="line.color">Warna Garis</span></button>
      <button class="sub-opt" data-line="style">〰️ <span data-i18n="line.style">Style Garis</span></button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       FORM MODAL (input data)
  ══════════════════════════════════════════ -->
  <div id="form-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-title">Form</span>
        <button class="panel-close" data-panel="form-modal">✕</button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- dinamis via JS -->
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn-ghost" data-i18n="cancel">Batal</button>
        <button id="modal-save" class="btn-primary" data-i18n="save">Simpan</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       WARNING MODAL (node lock conflict)
  ══════════════════════════════════════════ -->
  <div id="warn-modal" class="modal hidden">
    <div class="modal-box modal-warn">
      <div class="modal-header">
        <span>⚠️ <span data-i18n="warn.title">Perhatian</span></span>
      </div>
      <div class="modal-body">
        <p id="warn-message" data-i18n="warn.editing">Admin lain sedang mengedit node ini. Tetap lanjutkan?</p>
      </div>
      <div class="modal-footer">
        <button id="warn-cancel" class="btn-ghost" data-i18n="cancel">Batal</button>
        <button id="warn-confirm" class="btn-danger" data-i18n="warn.continue">Lanjutkan</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       TOAST NOTIFICATION
  ══════════════════════════════════════════ -->
  <div id="toast-container"></div>

</body>
</html>
