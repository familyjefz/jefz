<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Silsilah Keluarga</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.css">
  <style>
    /* ========== CSS ANDA ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #4374d6;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #8cabe5;
      flex-shrink: 0;
      border-bottom: 1px solid #ddd;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      color: #fff;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
    }

    .family-selector {
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background: white;
      font-size: 12px;
      cursor: pointer;
    }

    .zoom-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .zoom-controls button {
      background: #000000;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .zoom-controls button:hover {
      background: #00a8f7;
    }

    .login-btn {
      background: #000000 !important;
    }

    .login-btn:hover {
      background: #00a8f7 !important;
    }

    .add-family-btn {
      background: #ff9800 !important;
    }

    .add-family-btn:hover {
      background: #e68900 !important;
    }

    .tree-wrapper {
      flex: 1;
      overflow: auto;
      background: #f1fcff;
      position: relative;
    }

    .tree-zoom-container {
      transform-origin: center center;
      transition: transform 0.1s ease;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: max-content;
      min-height: max-content;
    }

    /* Forest container untuk multi-tree */
    .forest-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 50px;
      flex-wrap: wrap;
      padding: 40px;
    }

    .tree-container {
      display: inline-block;
      vertical-align: top;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.5);
    }

    .tree-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
      padding: 5px;
      background: #f0f0f0;
      border-radius: 5px;
    }

    .node-box {
      background: #d3d2d29d;
      border: 1px solid #888888;
      border-radius: 5px;
      padding: 4px 6px;
      min-width: 70px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .active-node {
      border: 2px solid #2196f3 !important;
      background: #e3f2fd !important;
    }

    .node-name {
      font-weight: bold;
      font-size: 9px;
      margin-bottom: 4px;
      white-space: normal;
      word-break: break-word;
      line-height: 1.3;
    }

    .node-buttons {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      justify-content: center;
    }

    .node-buttons button {
      flex: 1;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 7px;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn-info {
      background: #5391c4;
      color: #000000fd;
    }

    .btn-info:hover {
      background: #0b7dda;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      margin: 10% auto;
      padding: 0;
      width: 90%;
      max-width: 500px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgb(158, 232, 255);
    }

    .info-modal-content {
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 15px;
      background: #76abc4;
      color: black;
      border-radius: 10px 10px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-header {
      background: #8cabe5;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 18px;
    }

    .close, .close-info, .close-edit, .close-family {
      color: rgba(0, 0, 0, 0.979);
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
    }

    .pin-input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 5px;
      font-size: 16px;
      text-align: center;
    }

    .pin-submit {
      background: #52525254;
      color: rgb(0, 0, 0);
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    .pin-error {
      color: red;
      font-size: 12px;
      margin: 5px 0;
    }

    textarea.node-input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-family: Arial, sans-serif;
      resize: vertical;
      background: rgba(255,255,255,0.9);
    }

    .node-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .node-actions button {
      padding: 5px 15px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 15px;
    }

    .info-label {
      font-weight: bold;
      color: #2196f3;
      font-size: 12px;
    }

    .info-value {
      color: #333;
      font-size: 11px;
      line-height: 1.4;
      margin-top: 3px;
    }

    .empty-info {
      color: #999;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h2>Silsilah Keluarga</h2>
    <div class="controls">
      <select id="family-selector" class="family-selector">
        <option value="all">-- Semua Keluarga --</option>
      </select>
      <div class="zoom-controls">
        <button id="add-family-btn" class="add-family-btn" style="display:none;">➕ Tambah Keluarga</button>
        <button id="zoom-in">🔍+</button>
        <button id="zoom-out">🔍-</button>
        <button id="zoom-reset">⟳</button>
        <button id="login-btn" class="login-btn">👤 Login Admin</button>
      </div>
    </div>
  </div>
  <div class="tree-wrapper" id="tree-wrapper">
    <div class="tree-zoom-container" id="tree-zoom-container">
      <div id="tree-container"></div>
    </div>
  </div>
</div>

<!-- Modal Login -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Login Admin</h3>
      <span class="close">&times;</span>
    </div>
    <div class="modal-body">
      <input type="password" id="pin-input" class="pin-input" placeholder="Masukkan PIN">
      <div id="pin-error" class="pin-error"></div>
      <button id="submit-pin" class="pin-submit">Login</button>
    </div>
  </div>
</div>

<!-- Modal Info -->
<div id="info-modal" class="modal">
  <div class="modal-content info-modal-content">
    <div class="modal-header info-header">
      <h3 id="info-title">Informasi</h3>
      <span class="close-info">&times;</span>
    </div>
    <div class="modal-body" id="info-body"></div>
  </div>
</div>

<!-- Modal Edit -->
<div id="edit-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Edit Nama</h3>
      <span class="close-edit">&times;</span>
    </div>
    <div class="modal-body">
      <textarea id="edit-input" class="node-input" rows="3" placeholder="Tulis nama (Enter untuk baris baru)"></textarea>
      <div class="node-actions">
        <button id="save-edit" style="background:#4caf50; color:white;">✔ Simpan</button>
        <button id="cancel-edit" style="background:#f44336; color:white;">✖ Batal</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Tambah Keluarga -->
<div id="add-family-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>➕ Tambah Keluarga Baru</h3>
      <span class="close-family">&times;</span>
    </div>
    <div class="modal-body">
      <input type="text" id="new-family-name" class="pin-input" placeholder="Contoh: >Budi |">
      <div id="family-error" class="pin-error"></div>
      <button id="submit-family" class="pin-submit">Tambah Keluarga</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.min.js"></script>
<script>
// ========== CONFIG ==========
const SUPABASE_URL = "https://btyrorlzdyisuvnwmrqp.supabase.co";
let currentView = "all";
let currentZoom = 1;
let isAdmin = false;
let currentEditPath = null;
let currentEditFamilyId = null;
let FAMILIES = [];

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
}

function cleanData(node) {
  if (!node) return node;
  const cleanNode = { ...node };
  delete cleanNode._siblingGroupId;
  if (cleanNode.children && Array.isArray(cleanNode.children)) {
    cleanNode.children = cleanNode.children.map(child => cleanData(child));
  }
  return cleanNode;
}

function getNodeByPath(node, path) {
  if (!path || path.length === 0) return node;
  let current = node;
  for (let i = 0; i < path.length; i++) {
    if (!current.children || !current.children[path[i]]) return null;
    current = current.children[path[i]];
  }
  return current;
}

// ========== DATA STATIS FALLBACK ==========
function useStaticData() {
  FAMILIES = [
    {
      id: 1,
      name: "Sekghor",
      data: {
        name: ">Sekghor |",
        children: [
          { name: ">Salama | Tohin", children: [] },
          { name: ">Ryfan |", children: [] },
          { name: ">Abd Hary |", children: [] }
        ]
      }
    }
  ];
}

// ========== LOAD DARI SUPABASE ==========
async function loadFromSupabase() {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-all-families`);
    if (!res.ok) throw new Error("HTTP error");
    const data = await res.json();
    console.log("Data dari Supabase:", data);
    
    if (Array.isArray(data) && data.length > 0) {
      FAMILIES = data.map((family, idx) => ({
        id: idx + 1,
        name: family.name ? (family.name.includes("|") ? family.name.split("|")[0].trim() : family.name) : `Keluarga ${idx + 1}`,
        data: cleanData(family)
      }));
    } else {
      useStaticData();
    }
  } catch (err) {
    console.error("Gagal load dari Supabase, pakai data statis:", err);
    useStaticData();
  }
  updateFamilySelector();
  render();
}

// ========== SAVE KE SUPABASE ==========
async function saveToSupabase() {
  const dataToSave = FAMILIES.map(f => f.data);
  try {
    await fetch(`${SUPABASE_URL}/functions/v1/update-tree`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "replace", data: dataToSave })
    });
  } catch (err) {
    console.error("Gagal save ke Supabase:", err);
  }
}

// ========== GENERATE INFO ==========
function generateInfo(node, familyName) {
  let spouse = null;
  if (node.name && node.name.includes("|")) {
    const parts = node.name.split("|");
    if (parts.length > 1 && parts[1].trim()) spouse = parts[1].trim();
  }
  
  const children = node.children || [];
  const childrenList = children.length > 0 ? children.map((c, i) => `${i+1}. ${c.name}`).join('<br>') : null;
  
  let grandchildren = [];
  children.forEach(child => {
    if (child.children) grandchildren = grandchildren.concat(child.children);
  });
  const grandchildrenList = grandchildren.length > 0 ? grandchildren.map((gc, i) => `${i+1}. ${gc.name}`).join('<br>') : null;
  
  return `
    <div class="info-grid">
      <div><div class="info-label">👤 Nama</div><div class="info-value">${escapeHtml(node.name.split("|")[0].trim())}</div></div>
      <div><div class="info-label">💑 Pasangan</div><div class="info-value">${spouse ? escapeHtml(spouse) : '<span class="empty-info">-</span>'}</div></div>
      <div><div class="info-label">👶 Anak</div><div class="info-value">${childrenList ? escapeHtml(childrenList).replace(/\n/g,'<br>') : '<span class="empty-info">-</span>'}</div></div>
      <div><div class="info-label">👶 Cucu</div><div class="info-value">${grandchildrenList ? escapeHtml(grandchildrenList).replace(/\n/g,'<br>') : '<span class="empty-info">-</span>'}</div></div>
      <div><div class="info-label">🏠 Keluarga</div><div class="info-value">${escapeHtml(familyName)}</div></div>
    </div>
  `;
}

// ========== RENDER TREE ==========
function render() {
  const container = document.getElementById("tree-container");
  if (!container) return;
  
  container.innerHTML = "";
  
  if (currentView === "all") {
    const forestDiv = document.createElement("div");
    forestDiv.className = "forest-container";
    
    FAMILIES.forEach(family => {
      const treeDiv = document.createElement("div");
      treeDiv.className = "tree-container";
      
      const title = document.createElement("div");
      title.className = "tree-title";
      title.innerText = family.name;
      treeDiv.appendChild(title);
      
      const tempDiv = document.createElement("div");
      tempDiv.id = `tree-${family.id}`;
      treeDiv.appendChild(tempDiv);
      
      forestDiv.appendChild(treeDiv);
      
      new Treant({
        chart: {
          container: `#tree-${family.id}`,
          rootOrientation: "NORTH",
          connectors: { type: "step" },
          animateOnInit: false,
          levelSeparation: 30,
          siblingSeparation: 30
        },
        nodeStructure: convertWithButtons(family.data, family.id, [])
      });
    });
    
    container.appendChild(forestDiv);
  } else {
    const family = FAMILIES.find(f => f.id == currentView);
    if (family) {
      new Treant({
        chart: {
          container: "#tree-container",
          rootOrientation: "NORTH",
          connectors: { type: "step" },
          animateOnInit: false,
          levelSeparation: 30,
          siblingSeparation: 30
        },
        nodeStructure: convertWithButtons(family.data, family.id, [])
      });
    }
  }
}

function convertWithButtons(node, familyId, path) {
  const currentPath = [...path];
  
  let buttonsHtml = '';
  if (isAdmin) {
    buttonsHtml = `<div class="node-buttons">
      <button onclick='showEdit(${familyId}, ${JSON.stringify(currentPath)}, \`${escapeHtml(node.name).replace(/`/g, '\\`')}\`)' style="background:#2196f3">✏️</button>
      <button onclick='showDelete(${familyId}, ${JSON.stringify(currentPath)})' style="background:#f44336">🗑️</button>
      <button onclick='showAddChild(${familyId}, ${JSON.stringify(currentPath)})' style="background:#4caf50">➕</button>
    </div>`;
  }
  buttonsHtml += `<div class="node-buttons"><button onclick='showInfo(${familyId}, ${JSON.stringify(currentPath)})' style="background:#5391c4">📄 Info</button></div>`;
  
  return {
    innerHTML: `<div class="node-box"><div class="node-name">${escapeHtml(node.name)}</div>${buttonsHtml}</div>`,
    children: node.children?.map((child, idx) => convertWithButtons(child, familyId, [...currentPath, idx])) || []
  };
}

// ========== INFO ==========
function showInfo(familyId, pathStr) {
  const family = FAMILIES.find(f => f.id == familyId);
  if (!family) return;
  const path = JSON.parse(pathStr);
  const node = getNodeByPath(family.data, path);
  if (!node) return;
  
  const infoHtml = generateInfo(node, family.name);
  document.getElementById("info-title").innerHTML = `📋 Info: ${escapeHtml(node.name.split("|")[0].trim())}`;
  document.getElementById("info-body").innerHTML = infoHtml;
  document.getElementById("info-modal").style.display = "block";
}

// ========== EDIT ==========
function showEdit(familyId, pathStr, currentName) {
  if (!isAdmin) return;
  currentEditFamilyId = familyId;
  currentEditPath = JSON.parse(pathStr);
  document.getElementById("edit-input").value = currentName;
  document.getElementById("edit-modal").style.display = "block";
}

function saveEdit() {
  if (!isAdmin) return;
  const newName = document.getElementById("edit-input").value.trim();
  if (!newName) { alert("Nama tidak boleh kosong!"); return; }
  
  const family = FAMILIES.find(f => f.id === currentEditFamilyId);
  if (family) {
    const node = getNodeByPath(family.data, currentEditPath);
    if (node) node.name = newName;
  }
  closeEditModal();
  render();
  saveToSupabase();
  alert("Nama berhasil diubah!");
}

// ========== DELETE ==========
function showDelete(familyId, pathStr) {
  if (!isAdmin) return;
  if (!confirm("Hapus node ini?")) return;
  
  const family = FAMILIES.find(f => f.id == familyId);
  if (!family) return;
  const path = JSON.parse(pathStr);
  
  if (path.length === 0) {
    if (confirm("Hapus seluruh keluarga ini?")) {
      const idx = FAMILIES.findIndex(f => f.id == familyId);
      if (idx !== -1) FAMILIES.splice(idx, 1);
      updateFamilySelector();
      render();
      saveToSupabase();
    }
    return;
  }
  
  const parentPath = path.slice(0, -1);
  const childIndex = path[path.length - 1];
  const parent = parentPath.length === 0 ? family.data : getNodeByPath(family.data, parentPath);
  if (parent && parent.children) {
    parent.children.splice(childIndex, 1);
    render();
    saveToSupabase();
  }
}

// ========== ADD CHILD ==========
function showAddChild(familyId, pathStr) {
  if (!isAdmin) return;
  const newName = prompt("Masukkan nama anak baru:");
  if (!newName) return;
  
  const family = FAMILIES.find(f => f.id == familyId);
  if (!family) return;
  const path = JSON.parse(pathStr);
  const node = path.length === 0 ? family.data : getNodeByPath(family.data, path);
  if (node) {
    if (!node.children) node.children = [];
    node.children.push({ name: newName, children: [] });
    render();
    saveToSupabase();
  }
}

// ========== TAMBAH KELUARGA ==========
function addNewFamily() {
  if (!isAdmin) return;
  const familyName = document.getElementById("new-family-name").value.trim();
  if (!familyName) {
    document.getElementById("family-error").innerText = "Nama keluarga tidak boleh kosong!";
    return;
  }
  const newId = FAMILIES.length + 1;
  FAMILIES.push({
    id: newId,
    name: familyName.split("|")[0].trim(),
    data: { name: familyName, children: [] }
  });
  document.getElementById("new-family-name").value = "";
  closeAddFamilyModal();
  updateFamilySelector();
  render();
  saveToSupabase();
  alert("Keluarga baru ditambahkan!");
}

// ========== UPDATE DROPDOWN ==========
function updateFamilySelector() {
  const selector = document.getElementById("family-selector");
  if (!selector) return;
  while (selector.options.length > 1) selector.remove(1);
  FAMILIES.forEach(family => {
    const opt = document.createElement("option");
    opt.value = family.id;
    opt.text = family.name;
    selector.appendChild(opt);
  });
  selector.value = currentView === "all" ? "all" : currentView;
}

function onFamilyChange() {
  currentView = document.getElementById("family-selector").value;
  render();
}

// ========== ZOOM ==========
function setZoom(z) {
  currentZoom = z;
  const zoomContainer = document.getElementById("tree-zoom-container");
  zoomContainer.style.transform = `scale(${z})`;
}
function zoomIn() { setZoom(currentZoom + 0.1); }
function zoomOut() { setZoom(currentZoom - 0.1); }
function zoomReset() { setZoom(1); }

// ========== LOGIN ==========
function showLoginModal() { document.getElementById("login-modal").style.display = "block"; }
function closeLoginModal() { document.getElementById("login-modal").style.display = "none"; }
function closeInfoModal() { document.getElementById("info-modal").style.display = "none"; }
function closeEditModal() { document.getElementById("edit-modal").style.display = "none"; }
function closeAddFamilyModal() { document.getElementById("add-family-modal").style.display = "none"; }
function showAddFamilyModal() { if (isAdmin) document.getElementById("add-family-modal").style.display = "block"; }

function checkPin() {
  const pin = document.getElementById("pin-input").value;
  if (pin === "00") {
    isAdmin = true;
    closeLoginModal();
    alert("Login berhasil!");
    document.getElementById("add-family-btn").style.display = "inline-block";
    render();
  } else {
    document.getElementById("pin-error").innerText = "PIN salah!";
  }
}

// ========== EVENT ==========
document.getElementById("family-selector")?.addEventListener("change", onFamilyChange);
document.getElementById("zoom-in")?.addEventListener("click", zoomIn);
document.getElementById("zoom-out")?.addEventListener("click", zoomOut);
document.getElementById("zoom-reset")?.addEventListener("click", zoomReset);
document.getElementById("login-btn")?.addEventListener("click", showLoginModal);
document.querySelector(".close")?.addEventListener("click", closeLoginModal);
document.querySelector(".close-info")?.addEventListener("click", closeInfoModal);
document.querySelector(".close-edit")?.addEventListener("click", closeEditModal);
document.querySelector(".close-family")?.addEventListener("click", closeAddFamilyModal);
document.getElementById("submit-pin")?.addEventListener("click", checkPin);
document.getElementById("add-family-btn")?.addEventListener("click", showAddFamilyModal);
document.getElementById("submit-family")?.addEventListener("click", addNewFamily);
document.getElementById("save-edit")?.addEventListener("click", saveEdit);
document.getElementById("cancel-edit")?.addEventListener("click", closeEditModal);

window.addEventListener("click", (e) => {
  if (e.target === document.getElementById("login-modal")) closeLoginModal();
  if (e.target === document.getElementById("info-modal")) closeInfoModal();
  if (e.target === document.getElementById("edit-modal")) closeEditModal();
  if (e.target === document.getElementById("add-family-modal")) closeAddFamilyModal();
});

loadFromSupabase();
</script>
