<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Silsilah Keluarga</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
  <div class="header">
    <h2>Silsilah Keluarga</h2>
    <div class="header-controls">
      <button id="undo-btn" class="undo-btn" style="display:none;">↩️ Undo</button>
      <button id="redo-btn" class="redo-btn" style="display:none;">↪️ Redo</button>
      <button id="invert-btn" class="invert-btn">🎨 Invert</button>
      <button id="login-btn" class="login-btn">👤 Login Admin</button>
    </div>
  </div>
  
  <div class="tree-wrapper" id="tree-wrapper">
    <div class="tree-zoom-container" id="tree-zoom-container">
      <div id="tree"></div>
    </div>
  </div>
  
  <!-- Zoom Controls di Bawah Tengah -->
  <div class="bottom-zoom-bar">
    <button id="zoom-reset" class="zoom-reset-btn">⟳</button>
    <input type="range" id="zoom-slider" class="zoom-slider" min="30" max="200" value="100" step="1">
    <span id="zoom-value" class="zoom-value">100%</span>
  </div>
</div>

<!-- Modal Login -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Login Admin</h3>
      <span class="close">&times;</span>
    </div>
    <div class="modal-body">
      <p>Masukkan PIN untuk mengakses menu edit:</p>
      <input type="password" id="pin-input" class="pin-input" placeholder="Masukkan PIN">
      <div id="pin-error" class="pin-error"></div>
      <button id="submit-pin" class="pin-submit">Login</button>
    </div>
  </div>
</div>

<!-- Modal Info -->
<div id="info-modal" class="modal">
  <div class="modal-content info-modal-content">
    <div class="modal-header info-header">
      <h3 id="info-title">Informasi</h3>
      <span class="close-info">&times;</span>
    </div>
    <div class="modal-body" id="info-body"></div>
  </div>
</div>

<!-- Custom Popup -->
<div id="custom-popup" class="custom-popup">
  <div class="custom-popup-content">
    <div class="custom-popup-header">
      <h4 id="popup-title">Peringatan</h4>
    </div>
    <div class="custom-popup-body" id="popup-message"></div>
    <div class="custom-popup-buttons" id="popup-buttons"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.min.js"></script>
<script src="config.js"></script>
<script src="family-tree.js"></script>
<script src="family-info.js"></script>
<script src="main.js"></script>
</body>
</html>
<!--Stable-->
