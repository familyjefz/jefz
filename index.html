<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Silsilah Keluarga</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #4374d6;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #8cabe5;
      flex-shrink: 0;
      border-bottom: 1px solid #ddd;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      color: #fff;
    }

    .zoom-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .zoom-controls button {
      background: #000000;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .zoom-controls button:hover {
      background: #00a8f7;
    }

    .login-btn {
      background: #000000 !important;
    }

    .login-btn:hover {
      background: #00a8f7 !important;
    }

    .iframe-container {
      flex: 1;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h2>Silsilah Keluarga</h2>
    <div class="zoom-controls">
      <button id="zoom-in">🔍+</button>
      <button id="zoom-out">🔍-</button>
      <button id="zoom-reset">⟳</button>
      <button id="login-btn" class="login-btn">👤 Login Admin</button>
    </div>
  </div>
  <div class="iframe-container">
    <iframe id="tree-iframe" src="tree.html"></iframe>
  </div>
</div>

<!-- Modal Login -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Login Admin</h3>
      <span class="close">&times;</span>
    </div>
    <div class="modal-body">
      <p>Masukkan PIN untuk mengakses menu edit:</p>
      <input type="password" id="pin-input" class="pin-input" placeholder="Masukkan PIN">
      <div id="pin-error" class="pin-error"></div>
      <button id="submit-pin" class="pin-submit">Login</button>
    </div>
  </div>
</div>

<!-- Modal Info -->
<div id="info-modal" class="modal">
  <div class="modal-content info-modal-content">
    <div class="modal-header info-header">
      <h3 id="info-title">Informasi</h3>
      <span class="close-info">&times;</span>
    </div>
    <div class="modal-body" id="info-body"></div>
  </div>
</div>

<script>
// Komunikasi dengan iframe
const iframe = document.getElementById('tree-iframe');

function sendToIframe(type, data) {
  iframe.contentWindow.postMessage({ type, data }, '*');
}

// Zoom
document.getElementById('zoom-in').onclick = () => sendToIframe('zoom', 'in');
document.getElementById('zoom-out').onclick = () => sendToIframe('zoom', 'out');
document.getElementById('zoom-reset').onclick = () => sendToIframe('zoom', 'reset');

// Login
document.getElementById('login-btn').onclick = () => document.getElementById('login-modal').style.display = 'block';
document.querySelector('.close').onclick = () => document.getElementById('login-modal').style.display = 'none';
document.querySelector('.close-info').onclick = () => document.getElementById('info-modal').style.display = 'none';
document.getElementById('submit-pin').onclick = async () => {
  const pin = document.getElementById('pin-input').value;
  const res = await fetch('https://btyrorlzdyisuvnwmrqp.supabase.co/functions/v1/check-pin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin })
  });
  const result = await res.json();
  if (result.success) {
    document.getElementById('login-modal').style.display = 'none';
    sendToIframe('login', true);
    alert('Login berhasil');
  } else {
    document.getElementById('pin-error').innerText = 'PIN salah';
  }
};

// Terima pesan dari iframe (info)
window.addEventListener('message', (e) => {
  if (e.data.type === 'showInfo') {
    document.getElementById('info-title').innerHTML = e.data.title;
    document.getElementById('info-body').innerHTML = e.data.body;
    document.getElementById('info-modal').style.display = 'block';
  }
});
</script>

<style>
  /* Modal styles - sama seperti sebelumnya */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
  }
  .modal-content {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    margin: 10% auto;
    padding: 0;
    width: 90%;
    max-width: 400px;
    border-radius: 10px;
  }
  .info-modal-content { max-width: 600px; max-height: 80vh; overflow-y: auto; }
  .modal-header {
    padding: 15px;
    background: #76abc4;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
  }
  .info-header { background: #8cabe5; }
  .modal-header h3 { margin: 0; }
  .close, .close-info {
    font-size: 28px;
    cursor: pointer;
  }
  .modal-body { padding: 20px; }
  .pin-input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 5px;
    text-align: center;
  }
  .pin-submit {
    width: 100%;
    padding: 10px;
    background: #52525254;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .pin-error { color: red; font-size: 12px; }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .info-label { font-weight: bold; color: #2196f3; }
  .info-value { margin-top: 3px; }
  .empty-info { color: #999; font-style: italic; }
  @media (max-width:600px) { .info-grid { grid-template-columns: 1fr; } }
</style>
</body>
</html>
