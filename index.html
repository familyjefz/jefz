<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Silsilah</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.css">
  <style>
    #tree { width: 100%; height: 80vh; }
  </style>
</head>
<body>
<h2>Test Silsilah</h2>
<div id="tree"></div>

<script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.min.js"></script>
<script>
// Data statis langsung di sini
const data = {
  name: ">Sekghor |",
  children: [
    { name: ">Salama | Tohin", children: [] },
    { name: ">Ryfan |", children: [] },
    { name: ">Abd Hary |", children: [] }
  ]
};

new Treant({
  chart: {
    container: "#tree",
    rootOrientation: "NORTH",
    connectors: { type: "step" },
    animateOnInit: false,
    levelSeparation: 30,
    siblingSeparation: 30
  },
  nodeStructure: {
    innerHTML: `<div class="node-box"><div class="node-name">${data.name}</div></div>`,
    children: data.children.map(child => ({
      innerHTML: `<div class="node-box"><div class="node-name">${child.name}</div></div>`,
      children: []
    }))
  }
});
</script>
</body>
</html>
